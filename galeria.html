<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="galeria-container">

  <h1 class="titulo">My Drawings</h1>
  <p class="subtitulo">Digital Art Collection</p>

  <div class="galeria-grid">
    <img src="dibujo1.png" onclick="abrirImagen(this)">
    <img src="dibujo2.png" onclick="abrirImagen(this)">
    <img src="dibujo3.png" onclick="abrirImagen(this)">
    <img src="dibujo4.png" onclick="abrirImagen(this)">
    <img src="dibujo5.png" onclick="abrirImagen(this)">
    <img src="dibujo6.png" onclick="abrirImagen(this)">
    <img src="dibujo7.png" onclick="abrirImagen(this)">
    <img src="dibujo8.png" onclick="abrirImagen(this)">
  </div>

  <a href="index.html" class="btn">⬅ Back</a>

</div>

<div id="visor" class="visor">
  <span class="cerrar" onclick="cerrarVisor()">✕</span>
  <span class="prev" onclick="cambiarImagen(-1)">❮</span>

  <img id="imagenGrande">

  <span class="next" onclick="cambiarImagen(1)">❯</span>
</div>

<script src="galeria.js"></script>
</body>
</html>
